name: Build and Versioning Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Image Version
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}

      - name: Generate Detailed Summary
        run: |
          echo "### 🚀 Latest Build Detail" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`sha-${{ steps.vars.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Message:** $(git log -1 --pretty=%B)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed:**" >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD^ HEAD | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Version History (Last 5)" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commit Message | Files Changed |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          
          for i in {0..4}; do
            SHA=$(git rev-parse --short HEAD~$i)
            MSG=$(git log -1 --pretty=%s HEAD~$i)
            FILES_COUNT=$(git diff --name-only HEAD~$(($i+1)) HEAD~$i | wc -l)
            echo "| \`sha-$SHA\` | $MSG | $FILES_COUNT files |" >> $GITHUB_STEP_SUMMARY
          done
